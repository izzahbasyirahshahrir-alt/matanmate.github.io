const TANDA_ARAB = /[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g;
const norm = s => String(s)
  .normalize("NFKD")
  .replace(TANDA_ARAB, "")
  .replace(/[\u0671\u0622\u0623\u0625]/g, "\u0627")
  .replace(/\u0649/g, "\u064A")
  .replace(/['\u2019\u2018\u02BF\u02BB`]/g, "")
  .replace(/\s+/g, " ")
  .trim()
  .toLowerCase();

  e.kalimah = e.kalimah.trim();
  e.konteks = e.konteks.trim();
  e.matan = e.matan || {};
  e.bacaan.forEach(b => { b.teks = b.teks.trim(); b.cara = b.cara.trim(); });
  e._cari = norm([e.kalimah, e.konteks, ...e.bacaan.flatMap(b => [b.teks, b.cara, ...b.imam])].join(" "));
});

/* ============ PAPARAN SENARAI ============ */

function binaMatan(nama, teks) {
  const ada = teks && teks.trim();
  let isi;
  if (!ada) {
    isi = `<div class="kosong">Belum diisi. Masukkan bait daripada edisi tahqiq.</div>`;
  } else {
    const baris = teks.trim().split("\n").map(b => esc(b.trim())).join("<br>");
    // Jika tiada huruf Arab (nota biasa), paparkan sebagai teks LTR
    isi = /[\u0600-\u06FF]/.test(teks)
      ? `<div class="arab" lang="ar">${baris}</div>`
      : `<div class="nota">${baris}</div>`;
  }
  return `<div class="matan"><strong>${esc(nama)}</strong>${isi}</div>`;
}

function binaKad(e, pilihMatan) {
  const bacaanHtml = e.bacaan.map(b => `
    <div class="bacaan">
      <div class="arab" lang="ar">${esc(b.teks)}</div>
      <div>${b.imam.map(i => `<span class="imam">${esc(i)}</span>`).join("")}</div>
      <div class="cara"><strong>Cara bacaan:</strong> ${esc(b.cara)}</div>
    </div>`).join("");

  let matanHtml = "";
  if (pilihMatan !== "durrah")      matanHtml += binaMatan("Matan Asy-Syatibiyyah", e.matan.syatibiyyah);
  if (pilihMatan !== "syatibiyyah") matanHtml += binaMatan("Matan Ad-Durrah", e.matan.durrah);

  return `<div class="kad">
    <div class="ayat">Al-Baqarah ${esc(e.ayat)}</div>
    <div class="arab" lang="ar">${esc(e.konteks)}</div>
    <div>Kalimah (Hafs): <span class="arab kalimah" lang="ar">${esc(e.kalimah)}</span></div>
    ${bacaanHtml}
    ${matanHtml}
  </div>`;
}

function papar() {
  const q = $("cari").value.trim();
  const imam = $("tapisImam").value;
  const matan = $("tapisMatan").value;
  const qAyat = /^\d+\s*:\s*\d+$/.test(q) ? q.replace(/\s+/g, "") : null;
  const qn = norm(q);

  const hasil = DATA.filter(e => {
    const padanCari = !q || (qAyat ? e.ayat === qAyat : (e.ayat === q || e._cari.includes(qn)));
    const padanImam = !imam || e.bacaan.some(b => b.imam.includes(imam));
    const padanMatan = matan === "semua" || !!(e.matan[matan] && e.matan[matan].trim());
    return padanCari && padanImam && padanMatan;
  });

  $("bilangan").textContent = `${hasil.length} daripada ${DATA.length} kalimah`;
  $("senarai").innerHTML = hasil.length
    ? hasil.map(e => binaKad(e, matan)).join("")
    : `<p>Tiada hasil.</p>`;
}

/* ============ KAD IMBAS ============ */
let idx = 0, tunjuk = false;

function paparKadImbas() {
  const e = DATA[idx];
  const jawapan = e.bacaan.map(b => `
    <div class="bacaan">
      <div class="arab" lang="ar">${esc(b.teks)}</div>
      <div>${b.imam.map(i => `<span class="imam">${esc(i)}</span>`).join("")}</div>
      <div class="cara">${esc(b.cara)}</div>
    </div>`).join("");

  $("kadImbas").innerHTML = `
    <div class="ayat">Al-Baqarah ${esc(e.ayat)} (${idx + 1}/${DATA.length})</div>
    <div class="arab" lang="ar">${esc(e.konteks)}</div>
    <p>Soalan: Sebutkan khilaf bagi kalimah ini, siapa yang membaca setiap bacaan, dan caranya.</p>
    <div class="arab kalimah" lang="ar">${esc(e.kalimah)}</div>
    ${tunjuk ? jawapan : ""}`;
}

/* ============ AYAT AL-QURAN (kalimah khilaf berwarna) ============ */
// Setiap ayat dipecah kepada kata. PETA menunjuk id khilaf -> [ayat, kata mula, kata akhir].
const AYAT = [
  { no: "2:1", kata: ["الٓمٓ"] },
  { no: "2:2", kata: ["ذَٰلِكَ","ٱلْكِتَـٰبُ","لَا","رَيْبَ","ۛ","فِيهِ","ۛ","هُدًى","لِّلْمُتَّقِينَ"] },
  { no: "2:3", kata: ["ٱلَّذِينَ","يُؤْمِنُونَ","بِٱلْغَيْبِ","وَيُقِيمُونَ","ٱلصَّلَوٰةَ","وَمِمَّا","رَزَقْنَـٰهُمْ","يُنفِقُونَ"] },
  { no: "2:4", kata: ["وَٱلَّذِينَ","يُؤْمِنُونَ","بِمَآ","أُنزِلَ","إِلَيْكَ","وَمَآ","أُنزِلَ","مِن","قَبْلِكَ","وَبِٱلْـَٔاخِرَةِ","هُمْ","يُوقِنُونَ"] },
  { no: "2:5", kata: ["أُو۟لَـٰٓئِكَ","عَلَىٰ","هُدًى","مِّن","رَّبِّهِمْ","ۖ","وَأُو۟لَـٰٓئِكَ","هُمُ","ٱلْمُفْلِحُونَ"] }
];
const PETA = {
  1: ["2:1",0,0],  2: ["2:2",5,5],  3: ["2:2",5,7],
  4: ["2:3",1,1],  5: ["2:3",4,4],  6: ["2:3",6,6],
  7: ["2:4",1,1],  8: ["2:4",2,3],  9: ["2:4",5,6], 10: ["2:4",9,9], 11: ["2:4",10,10],
  12: ["2:5",0,0], 13: ["2:5",4,4], 14: ["2:5",6,6]
};
const angkaArab = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const entriDi = (ayat, i) => DATA.filter(e => {
  const p = PETA[e.id];
  return p && p[0] === ayat && i >= p[1] && i <= p[2];
});
let pilihan = null;

function paparAyat() {
  const entriPilih = pilihan ? entriDi(pilihan.ayat, pilihan.i) : [];
  const diwarna = new Set();
  entriPilih.forEach(e => {
    const p = PETA[e.id];
    for (let k = p[1]; k <= p[2]; k++) diwarna.add(p[0] + "#" + k);
  });

  $("ayatQuran").innerHTML = AYAT.map(a => {
    const kata = a.kata.map((w, i) => {
      if (!entriDi(a.no, i).length) return `<span class="kata">${esc(w)}</span>`;
      const pilih = diwarna.has(a.no + "#" + i) ? " pilih" : "";
      return `<button type="button" class="kata khilaf${pilih}" data-ayat="${a.no}" data-i="${i}">${esc(w)}</button>`;
    }).join(" ");
    return `<div class="ayatQ"><div class="arab teksAyat" lang="ar">${kata} <span class="penanda">\uFD3F${angkaArab(a.no.split(":")[1])}\uFD3E</span></div></div>`;
  }).join("");

  $("butiranAyat").innerHTML = entriPilih.length
    ? entriPilih.map(e => binaKad(e, "semua")).join("")
    : `<p class="petunjuk">Belum ada kalimah dipilih.</p>`;
}

$("ayatQuran").addEventListener("click", ev => {
  const b = ev.target.closest(".khilaf");
  if (!b) return;
  const p = { ayat: b.dataset.ayat, i: Number(b.dataset.i) };
  pilihan = (pilihan && pilihan.ayat === p.ayat && pilihan.i === p.i) ? null : p;
  paparAyat();
  if (pilihan) {
    const baru = $("ayatQuran").querySelector && $("ayatQuran").querySelector(`[data-ayat="${p.ayat}"][data-i="${p.i}"]`);
    if (baru) baru.focus();
    if ($("butiranAyat").scrollIntoView) $("butiranAyat").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
});

/* ============ PENGENDALI ACARA ============ */
const TAB = { ayat: ["tabAyat","paparAyat"], senarai: ["tabSenarai","paparSenarai"], kad: ["tabKad","paparKad"] };
function tukarTab(nama) {
  Object.entries(TAB).forEach(([k, [tab, papan]]) => {
    const aktif = k === nama;
    $(papan).classList.toggle("tersembunyi", !aktif);
    $(tab).classList.toggle("aktif", aktif);
    $(tab).setAttribute("aria-pressed", String(aktif));
  });
  if (nama === "kad") { tunjuk = false; paparKadImbas(); }
}

$("tabAyat").onclick    = () => tukarTab("ayat");
$("tabSenarai").onclick = () => tukarTab("senarai");
$("tabKad").onclick     = () => tukarTab("kad");
$("btnTunjuk").onclick  = () => { tunjuk = true; paparKadImbas(); };
$("btnSeterusnya").onclick = () => { idx = (idx + 1) % DATA.length; tunjuk = false; paparKadImbas(); };

["cari","tapisImam","tapisMatan"].forEach(id => {
  $(id).addEventListener("input", papar);
  $(id).addEventListener("change", papar);
});

[...SEMUA_IMAM, ...PERAWI].forEach(i => {
  const o = document.createElement("option");
  o.value = i; o.textContent = i;
  $("tapisImam").appendChild(o);
});

paparAyat();
papar();
</script>
